<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DAUTECH</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c1c1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DAUTECH">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f5f5f7;color:#1c1c1e;font-size:15px;overscroll-behavior:none}
.hdr{position:sticky;top:0;z-index:200;background:#1c1c1e;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.hdr h1{font-size:17px;font-weight:700;flex:1;line-height:1.15}
.badge{background:#0a84ff;color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.hdr-btn{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.hdr-btn.green{background:#30d158}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#30d158;flex-shrink:0}
.sync-dot.loading{background:#ff9f0a;animation:pulse 1s infinite}
.sync-dot.error{background:#ff375f}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes noticeBlink{0%,100%{background:#ffd54f}50%{background:#ffe57f}}
.search-bar{background:#fff;border-bottom:1px solid #e5e5ea;padding:10px 14px;position:sticky;top:50px;z-index:190}
.search-inner{display:flex;align-items:center;background:#f2f2f7;border-radius:12px;padding:0 12px;gap:8px}
.search-inner input{flex:1;border:none;background:transparent;font-size:15px;padding:10px 0;outline:none;color:#1c1c1e}
.search-inner input::placeholder{color:#8e8e93}
.clear-btn{background:none;border:none;color:#8e8e93;font-size:18px;padding:4px;cursor:pointer;display:none}
.filter-row{background:#fff;border-bottom:1px solid #e5e5ea;padding:8px 14px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:102px;z-index:180}
.filter-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:#f2f2f7;border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;color:#3c3c43;cursor:pointer;white-space:nowrap}
.chip.active{background:#0a84ff;color:#fff}
.info-bar{background:#f5f5f7;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.info-bar::-webkit-scrollbar{display:none}
.info-bar span{font-size:13px;color:#8e8e93}
.sort-select{background:none;border:none;font-size:13px;color:#0a84ff;font-weight:600;cursor:pointer;outline:none}
.list{padding:0 0 80px}
.card{background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:0.5px solid #e5e5ea}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;flex-wrap:wrap}
.ship-name{font-size:16px;font-weight:700;color:#0a84ff;cursor:pointer}
.ship-badges{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.b-inland{background:#dbeafe;color:#1d4ed8;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700}
.b-overseas{background:#ffedd5;color:#c2410c;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700}
.b-imo{background:#f2f2f7;color:#3c3c43;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
.status-badge{font-size:17px;font-weight:700;padding:9px 16px;border-radius:10px;white-space:nowrap}
.s-완료{background:#e8f5e9;color:#2e7d32}
.s-예정{background:#e3f2fd;color:#1565c0}
.s-연기{background:#fff3e0;color:#e65100}
.s-캔슬{background:#fce4ec;color:#c62828}
.card-btns{display:flex;gap:2px;flex-shrink:0}
.edit-btn,.del-btn{background:none;border:none;color:#c7c7cc;font-size:16px;padding:2px 4px;cursor:pointer}
.edit-btn:active{color:#0a84ff}
.del-btn:active{color:#ff375f}
.card-meta{display:flex;align-items:center;gap:6px;font-size:13px;color:#3c3c43;flex-wrap:wrap}
.card-meta .sep{color:#c7c7cc}
.card-date{font-size:14px;color:#1c1c1e;font-weight:700}
.section{margin-top:5px}
.section-title{font-size:11px;font-weight:700;color:#8e8e93;letter-spacing:.5px;margin-bottom:4px}
.engine-line{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:4px;line-height:1.5}
.eng-label{font-size:10px;color:#8e8e93;font-weight:700;flex-shrink:0}
.engine-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.eng-model{font-size:12px;color:#1c1c1e;font-weight:500}
.eng-gov{background:#f2f2f7;color:#3c3c43;font-size:10px;padding:1px 6px;border-radius:5px;font-weight:600}
.eng-work{background:#e8f4fd;color:#0055a5;font-size:10px;padding:1px 6px;border-radius:5px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;flex-shrink:0;white-space:nowrap}
.t-place{background:#f3e8fd;color:#6b21a8}
.t-overseas{background:#fdf3e8;color:#7c3a00}
.t-haga{background:#fff3e0;color:#b45309}
.t-depart{background:#e0f2fe;color:#0369a1}
.t-arrive{background:#e8f0fe;color:#1546a0}
.note-box{margin-top:6px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 12px;display:flex;align-items:flex-start;gap:6px}
.note-box .note-icon{font-size:14px;flex-shrink:0}
.note-box .note-text{font-size:13px;color:#92400e;line-height:1.5;font-weight:500}
.pager{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid #e5e5ea;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:8px;z-index:300}
.pg-btn{background:#f2f2f7;border:none;border-radius:10px;padding:8px 18px;font-size:14px;font-weight:600;color:#0a84ff;cursor:pointer}
.pg-btn:disabled{color:#c7c7cc}
.pg-info{font-size:13px;color:#8e8e93;min-width:70px;text-align:center}
.empty{text-align:center;padding:80px 20px;color:#8e8e93}
.empty .icon{font-size:48px;margin-bottom:12px}
/* 패널/모달 공통 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500}
.overlay.open{display:block}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;z-index:501;transform:translateY(100%);transition:transform .3s}
.bottom-sheet.open{transform:translateY(0)}
.bs-handle{width:36px;height:4px;background:#d1d1d6;border-radius:2px;margin:12px auto 0;flex-shrink:0}
.bs-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid #e5e5ea;flex-shrink:0}
.bs-header h2{font-size:17px;font-weight:700}
.bs-close{background:none;border:none;font-size:24px;color:#8e8e93;cursor:pointer}
.bs-body{flex:1;overflow-y:auto;padding:8px 16px}
.bs-footer{padding:12px 16px 30px;border-top:0.5px solid #e5e5ea;display:flex;gap:10px;flex-shrink:0}
/* 폼 */
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-group label{font-size:13px;font-weight:600;color:#3c3c43}
.req{color:#ff375f;margin-left:2px}
.form-input{background:#f2f2f7;border:none;border-radius:12px;padding:12px 14px;font-size:15px;color:#1c1c1e;outline:none;width:100%;font-family:inherit}
.form-input:focus{background:#e8f2ff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-select{background:#f2f2f7;border:none;border-radius:12px;padding:12px 14px;font-size:15px;color:#1c1c1e;outline:none;width:100%;font-family:inherit;-webkit-appearance:none}
.form-divider{font-size:12px;font-weight:700;color:#8e8e93;letter-spacing:.5px;border-bottom:1px solid #f2f2f7;padding-bottom:8px;margin-bottom:14px}
/* 버튼 */
.btn-reset{flex:1;background:#f2f2f7;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:600;color:#3c3c43;cursor:pointer}
.btn-primary{flex:2;background:#0a84ff;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer}
.btn-green{width:100%;background:#30d158;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;cursor:pointer}
.btn-blue{width:100%;background:#0a84ff;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;cursor:pointer}
/* 필터 FAB */
.filter-fab{position:fixed;bottom:62px;right:16px;background:#1c1c1e;color:#fff;border:none;border-radius:50px;padding:12px 20px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;z-index:400}
.filter-fab .dot{background:#ff375f;width:8px;height:8px;border-radius:50%;display:none}
.filter-fab .dot.on{display:block}
#filterDot.on{display:block !important}
/* 체크 칩 */
.check-grid{display:flex;flex-wrap:wrap;gap:7px;padding:8px 0}
.check-chip{background:#f2f2f7;border:1.5px solid transparent;border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:5px;color:#1c1c1e}
.check-chip.active{background:#e8f2ff;border-color:#0a84ff;color:#0a84ff}
.cnt{font-size:11px;color:#8e8e93}
/* 선박 목록 */
.vessel-item{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;border:0.5px solid #e5e5ea;display:flex;align-items:center;gap:10px;cursor:pointer}
.vessel-item:active{background:#f2f2f7}
.vessel-info{flex:1}
.vessel-name{font-size:15px;font-weight:700;color:#1c1c1e;margin-bottom:3px}
.vessel-sub{font-size:12px;color:#8e8e93}
.vessel-badges{display:flex;gap:4px;flex-shrink:0}
/* 토스트 */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* ===== 달력 뷰 ===== */
.cal-wrap{background:#fff;border-radius:14px;padding:12px;margin-top:8px;border:1px solid #e5e5ea;max-width:420px;margin-left:auto;margin-right:auto}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head button{background:none;border:none;font-size:20px;color:#0a84ff;cursor:pointer;padding:4px 10px}
.cal-title{font-size:16px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:38px;gap:3px}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:11px;color:#8e8e93;padding:4px 0}
.cal-dow.sun{color:#ff375f}.cal-dow.sat{color:#0a84ff}
.cal-cell{height:100%;border-radius:8px;background:#f7f7f9;display:flex;align-items:center;justify-content:center;font-size:13px;color:#3c3c43;cursor:pointer;position:relative;overflow:hidden}
.cal-cell.empty{background:transparent;cursor:default}
.cal-cell.today{outline:2px solid #ff375f;font-weight:700}
.cal-cell.selected{background:#0a84ff;color:#fff}
.cal-dots{position:absolute;bottom:4px;left:0;right:0;display:flex;gap:2px;flex-wrap:nowrap;justify-content:center}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cal-legend{display:flex;gap:12px;margin-top:10px;font-size:11px;color:#8e8e93;flex-wrap:wrap;justify-content:center}
.cal-legend span{display:flex;align-items:center;gap:4px}
.cal-day-list{margin-top:12px;max-width:420px;margin-left:auto;margin-right:auto}
.cal-day-title{font-size:14px;font-weight:700;margin-bottom:8px;padding:0 2px}
.cal-day-card{background:#fff;border:1px solid #e5e5ea;border-radius:10px;padding:10px 12px;margin-bottom:6px}
</style>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" integrity="sha384-TiCUE00h649CAMonG018J2ujOgDKW/kVWlChEuu4jK2vxfAAD0eZxzCKakxg55G4" crossorigin="anonymous"></script>
</head>
<body>

<div class="hdr">
  <span style="font-size:20px">⚙️</span>
  <h1><span style="white-space:nowrap">DAU</span> <span style="white-space:nowrap">TECH</span></h1>
  <div class="sync-dot loading" id="syncDot"></div>
  <div class="badge" id="totalBadge">-</div>
  <button class="hdr-btn" onclick="location.href='help.html?v='+Date.now()">❓</button>
  <button class="hdr-btn" onclick="openVesselList()">🚢 선박</button>
  <button class="hdr-btn green" onclick="openAddModal()">+ 추가</button>
</div>

<div id="weeklySummary"></div>

<div id="noticeBar" onclick="editNotice()" style="background:#ffd54f;padding:12px 16px;font-size:15px;color:#5d4000;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;animation:noticeBlink 1.6s ease-in-out infinite">
  <span style="flex-shrink:0">📢</span>
  <span id="noticeText" style="flex:1;line-height:1.4"></span>
</div>

<div class="search-bar">
  <div class="search-inner">
    <span style="color:#8e8e93;font-size:16px">🔍</span>
    <input type="search" id="searchInput" placeholder="선명 또는 선사 검색">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
</div>



<div class="info-bar">
  <div style="display:flex;align-items:center;gap:10px">
    <span style="white-space:nowrap"><strong id="resultCount">-</strong>건</span>
    <button id="viewToggleBtn" onclick="toggleCalendarView()" style="background:none;border:none;font-size:12px;color:#0a84ff;font-weight:600;cursor:pointer;padding:0;white-space:nowrap">📅 달력</button>
    <button onclick="openFilterMenu()" style="background:none;border:none;font-size:12px;color:#0a84ff;font-weight:600;cursor:pointer;padding:0;display:flex;align-items:center;gap:3px;white-space:nowrap">🔍 필터<span class="dot" id="filterDot" style="background:#ff375f;width:6px;height:6px;border-radius:50%;display:none"></span></button>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button id="bulkCheongguBtn" onclick="bulkCheongguComplete()" style="background:none;border:none;font-size:12px;color:#8e8e93;cursor:pointer;padding:0;white-space:nowrap">💰 청구완료</button>
    <select class="sort-select" id="sortSel" onchange="applyFilters()">
      <option value="date_desc">최신순</option>
      <option value="date_asc">오래된순</option>
      <option value="name">선명순</option>
    </select>
  </div>
</div>

<div class="list" id="list">
  <div class="empty"><div class="icon">⏳</div><p>데이터 불러오는 중...</p></div>
</div>

<div id="calendarView" style="display:none;padding:0 14px 20px"></div>

<div class="pager" id="pager" style="display:none">
  <button class="pg-btn" id="prevBtn" onclick="goPage(-1)" disabled>◀ 이전</button>
  <span class="pg-info" id="pgInfo"></span>
  <button class="pg-btn" id="nextBtn" onclick="goPage(1)">다음 ▶</button>
</div>


<!-- 필터 패널 -->
<div class="overlay" id="filterOverlay" onclick="closeFilterMenu()"></div>
<div class="bottom-sheet" id="filterPanel">
  <div class="bs-handle"></div>
  <div class="bs-header"><h2>필터</h2><button class="bs-close" onclick="closeFilterMenu()">✕</button></div>
  <div class="bs-body">
    <div style="display:flex;flex-direction:column;gap:8px;padding:8px 0">
      <button onclick="openPanel('상태')" style="background:#f2f2f7;border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;color:#1c1c1e;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
        <span>상태</span><span id="filterLabel_상태" style="font-size:13px;color:#0a84ff"></span>
      </button>
      <button onclick="openPanel('구분')" style="background:#f2f2f7;border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;color:#1c1c1e;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
        <span>국내/해외</span><span id="filterLabel_구분" style="font-size:13px;color:#0a84ff"></span>
      </button>
      <button onclick="openPanel('메인GOV')" style="background:#f2f2f7;border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;color:#1c1c1e;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
        <span>메인GOV</span><span id="filterLabel_메인GOV" style="font-size:13px;color:#0a84ff"></span>
      </button>
      <button onclick="openPanel('발전기GOV')" style="background:#f2f2f7;border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;color:#1c1c1e;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
        <span>발전기GOV</span><span id="filterLabel_발전기GOV" style="font-size:13px;color:#0a84ff"></span>
      </button>
      <button onclick="openPanel('청구')" style="background:#f2f2f7;border:none;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600;color:#1c1c1e;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
        <span>💰 청구</span><span id="filterLabel_청구" style="font-size:13px;color:#0a84ff"></span>
      </button>
    </div>
    <div id="panelBody"></div>
  </div>
  <div class="bs-footer">
    <button class="btn-reset" onclick="resetAllFilters()">전체 초기화</button>
    <button class="btn-primary" onclick="closeFilterMenu()">닫기</button>
  </div>
</div>

<!-- 작업 추가 모달 -->
<div class="overlay" id="addOverlay" onclick="closeAddModal()"></div>
<div class="bottom-sheet" id="addModal">
  <div class="bs-handle"></div>
  <div class="bs-header"><h2>작업 일정 추가</h2><button class="bs-close" onclick="closeAddModal()">✕</button></div>
  <div class="bs-body">
    <div class="form-row">
      <div class="form-group"><label>입항일정<span class="req">*</span></label><input type="date" class="form-input" id="a_날짜"></div>
      <div class="form-group"><label>상태</label>
        <select class="form-select" id="a_상태"><option value="예정">예정</option><option value="완료">완료</option><option value="연기">연기</option><option value="캔슬">캔슬</option></select>
      </div>
    </div>
    <div class="form-group">
      <label>선박 선택<span class="req">*</span></label>
      <div style="position:relative">
        <input type="text" class="form-input" id="a_선명" placeholder="선박명 입력 또는 선택" oninput="filterVesselSuggest(this.value,'a')">
        <div id="a_suggest" style="display:none;position:absolute;left:0;right:0;background:#fff;border:1px solid #e5e5ea;border-radius:12px;z-index:100;max-height:180px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.1)"></div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>선사</label><input type="text" class="form-input" id="a_선사" placeholder="자동입력"></div>
      <div class="form-group"><label>국내/해외</label>
        <select class="form-select" id="a_구분"><option value="국내">국내</option><option value="해외">해외</option></select>
      </div>
    </div>
    <div class="form-group"><label>조선소/장소</label><input type="text" class="form-input" id="a_장소" placeholder="장소 입력"></div>
    <div class="form-divider">🔧 메인엔진</div>

function localDateStr(d){
  d=d||new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function refDateInfo(d){
  // 입항·하가·출항 중 아직 안 지난(D-day>=0) 가장 이른 일정을 기준으로.
  // 다 지났으면 가장 늦은(최근) 일정.
  if(!d) return {date:null,basis:''};
  const cands=[['입항',d.날짜],['하가',d.하가일정],['출항',d.출항일정]].filter(x=>x[1]);
  if(!cands.length) return {date:null,basis:''};
  let future=null, latest=null;
  for(const [name,dt] of cands){
    if(!latest||dt>latest.date) latest={date:dt,basis:name};
    const dd=getDday(dt);
    if(dd!==null&&dd>=0){
      if(!future||dt<future.date) future={date:dt,basis:name};
    }
  }
  return future||latest;
}
function refDate(d){
  return refDateInfo(d).date;
}
function showsDday(d){
  // 예정이면 항상, 완료여도 하가/출항이 아직 안 지났으면 D-day 표시
  if(!d) return false;
  if(d.상태==='예정') return true;
  if(d.상태==='완료'){
    const hd=d.하가일정?getDday(d.하가일정):null;
    const od=d.출항일정?getDday(d.출항일정):null;
    if((hd!==null&&hd>=0)||(od!==null&&od>=0)) return true;
  }
  return false;
}
function getDday(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  return Math.floor((target-today)/(1000*60*60*24));
}

function getDdayBadge(dateStr){
  const d = getDday(dateStr);
  if(d===null) return '';
  if(d<0) return `<span style="background:#f2f2f7;color:#8e8e93;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600">D+${Math.abs(d)}</span>`;
  if(d===0) return `<span style="background:#ff375f;color:#fff;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700">D-day</span>`;
  if(d<=3) return `<span style="background:#ff9f0a;color:#fff;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700">D-${d}</span>`;
  if(d<=7) return `<span style="background:#fde68a;color:#92400e;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700">D-${d}</span>`;
  return `<span style="background:#f2f2f7;color:#3c3c43;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600">D-${d}</span>`;
}

function applyFilters(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const sort=document.getElementById('sortSel').value;
  filtered=ALL_DATA.filter(d=>{
    if(q&&!(d.선명||'').toLowerCase().includes(q)&&!(d.선사||'').toLowerCase().includes(q))return false;
    if(sel.상태.size&&!sel.상태.has(d.상태))return false;
    if(sel.구분.size&&!sel.구분.has(d.구분))return false;
    if(sel.메인GOV.size&&!sel.메인GOV.has(d.메인GOV))return false;
    if(sel.발전기GOV.size&&!sel.발전기GOV.has(d.발전기GOV))return false;
    if(sel.청구.size&&!sel.청구.has(d.청구||''))return false;
    return true;
  });
  if(sort==='date_asc')filtered.sort((a,b)=>(a.날짜||'').localeCompare(b.날짜||''));
  else if(sort==='date_desc')filtered.sort((a,b)=>(b.날짜||'').localeCompare(a.날짜||''));
  else filtered.sort((a,b)=>(a.선명||'').localeCompare(b.선명||'','ko'));
  // 입항/출항 임박 상단 고정
  filtered.sort((a,b)=>{
    const da=getDday(a.상태==='예정'?refDate(a):null);
    const db=getDday(b.상태==='예정'?refDate(b):null);
    // D+n ~ D-day: 출항 임박 (da<=0)
    // D-1 ~ D-7: 입항 임박 (1<=da<=7)
    const aPin=da!==null&&da<=7;
    const bPin=db!==null&&db<=7;
    if(aPin&&bPin) return da-db; // D-day 작은 것 먼저
    if(aPin&&!bPin) return -1;
    if(!aPin&&bPin) return 1;
    return 0;
  });
  updateFilterLabels();page=1;renderList();
}

function filterVesselSuggest(val, prefix){

  if(!val){sug.style.display='none';return;}
  const allVessels=getAllVessels();
  const matches=allVessels.filter(v=>(v.선명||'').toLowerCase().includes(val.toLowerCase())).slice(0,8);
  if(!matches.length){sug.style.display='none';return;}
  sug.style.display='block';
  sug.innerHTML=matches.map(v=>`
    <div onclick="selectVessel('${v.선명.replace(/'/g,"\\'")}','${prefix}')"

function selectVessel(name, prefix){
  document.getElementById(prefix+'_선명').value=name;

    if(document.getElementById(prefix+'_메인GOV')) document.getElementById(prefix+'_메인GOV').value=vm.메인GOV||'';

    if(document.getElementById(prefix+'_발전기GOV')) document.getElementById(prefix+'_발전기GOV').value=vm.발전기GOV||'';

}

// schedules 포함한 전체 선박 목록
function getAllVessels(){
  const masterMap={};
  // 1. BASE_VESSELS (삭제된 것 제외)
  BASE_VESSELS.forEach((v,i)=>{
    const uid='base_'+BASE_DATA.findIndex(d=>d.선명===v.선명);
    if(!deletedIds.has(uid)) masterMap[v.선명]={...v};
  });
  // 2. Firebase vessels (마스터) - 덮어씀
  fbVessels.forEach(v=>{ masterMap[v.선명]={...v}; });
  // 3. schedules에서 선박명 추출 (마스터에 없는 것만)
  const allSched=[...fbSchedules,...BASE_WITH_ID.filter(d=>!deletedIds.has(d._uid))];
  const seenNames=new Set();
  allSched.forEach(d=>{
    if(!d.선명||seenNames.has(d.선명))return;
    seenNames.add(d.선명);
    if(!masterMap[d.선명]){
      masterMap[d.선명]={
        선명:d.선명, 선사:d.선사||'',
        메인엔진:d.메인엔진||'', 메인GOV:d.메인GOV||'',
        발전기:d.발전기||'', 발전기GOV:d.발전기GOV||'',
        imo:'', 선박구분:'', _scheduleOnly:true
      };
    }
  });

function gv(id){return document.getElementById(id).value.trim();}

async function submitVesselForm(){
  const 선명=gv('vf_선명');
  if(!선명){alert('선박명은 필수입니다.');return;}
  const data={선명,선사:gv('vf_선사'),imo:gv('vf_imo'),선박구분:gv('vf_선박구분'),메인엔진:gv('vf_메인엔진'),메인GOV:gv('vf_메인GOV'),발전기:gv('vf_발전기'),발전기GOV:gv('vf_발전기GOV'),updatedAt:new Date().toISOString()};
  const fbId=document.getElementById('vf_fbId').value;
  const oldName=document.getElementById('vf_oldName')?.value||'';
  const btn=document.getElementById('vesselSubmitBtn');btn.textContent='저장 중...';btn.disabled=true;
  try{
    if(fbId){
      // 선명이 바뀐 경우 작업 기록도 전부 업데이트
      if(oldName && oldName!==선명){
        if(!confirm(`"${oldName}" → "${선명}" 으로 선명 변경 시 관련 작업 기록도 모두 변경됩니다. 계속할까요?`)){
          btn.textContent='💾 저장';btn.disabled=false;return;
        }
        // Firebase schedules에서 같은 선명 찾아서 업데이트
        const updates=fbSchedules.filter(s=>s.선명===oldName);
        await Promise.all([
          updateDoc(doc(db,'vessels',fbId),data),
          ...updates.map(s=>updateDoc(doc(db,'schedules',s._fbId),{선명}))
        ]);
        // BASE_DATA에서 같은 선명은 deleted_ids에 추가 후 새로 Firebase에 저장
        const baseMatches=BASE_WITH_ID.filter(s=>s.선명===oldName&&!deletedIds.has(s._uid));
        if(baseMatches.length>0){
          const newDel=new Set(deletedIds);
          baseMatches.forEach(s=>newDel.add(s._uid));
          const newDocs=baseMatches.map(s=>addDoc(collection(db,'schedules'),{...s,선명,_uid:undefined,createdAt:s.날짜||new Date().toISOString()}));
          await Promise.all([setDoc(doc(db,'meta','deleted_ids'),{ids:[...newDel]}),...newDocs]);
        }
      } else {
        await updateDoc(doc(db,'vessels',fbId),data);
      }
    } else {
      await addDoc(collection(db,'vessels'),data);
    }
    closeVesselForm();
    renderVesselList(document.getElementById('vesselSearchInput').value);
    renderList();
    showToast(`✅ "${선명}" 저장됐습니다!`);
  }catch(e){alert('저장 실패: '+e.message);}
  btn.textContent='💾 저장';btn.disabled=false;
}

    return dd!==null&&dd>=0&&dd<=7;
  }).sort((a,b)=>(refDate(a)||'').localeCompare(refDate(b)||''));
  if(!thisWeek.length) return alert('이번 주 예정 작업이 없습니다.');
  const lines=thisWeek.map(d=>{
    const info=refDateInfo(d);
    const dd=getDday(info.date);
    const ddayText=dd===0?'[D-day]':`[D-${dd}]`;
    return `🚢 ${d.선명} ${ddayText}\n📅 ${info.basis} ${info.date} · ${d.선사||'-'}\n📍 ${d.장소||'-'}`;
  }).join('\n\n');
  const text=`📋 DAUTECH 이번 주 작업 예정\n\n${lines}\n\n총 ${thisWeek.length}건\nDAUTECH: https://sjglemf.github.io/work-schedule/`;
  Kakao.Share.sendDefault({
    objectType:'text',
    text,
    link:{
      mobileWebUrl:'https://sjglemf.github.io/work-schedule/',
      webUrl:'https://sjglemf.github.io/work-schedule/',
    },
  });
}
window.kakaoShareWeekly=kakaoShareWeekly;

async function bulkCheongguComplete(){
  if(!confirm('완료 상태인 모든 작업을 청구완료로 일괄 변경할까요?\n(이미 청구완료인 것은 제외)'))return;
  const btn=document.getElementById('bulkCheongguBtn');
  btn.textContent='처리 중...';btn.disabled=true;
  let count=0;
  try{
    // 1. Firebase schedules에서 완료이고 청구완료 아닌 것
    const fbTargets=fbSchedules.filter(s=>s.상태==='완료'&&s.청구!=='청구완료');
    await Promise.all(fbTargets.map(s=>updateDoc(doc(db,'schedules',s._fbId),{청구:'청구완료'})));
    count+=fbTargets.length;
    // 2. BASE_DATA에서 완료이고 deleted_ids에 없는 것 → Firebase로 이동하며 청구완료
    const baseTargets=BASE_WITH_ID.filter(d=>d.상태==='완료'&&!deletedIds.has(d._uid));
    if(baseTargets.length>0){
      const newDel=new Set(deletedIds);
      baseTargets.forEach(d=>newDel.add(d._uid));
      const addOps=baseTargets.map(d=>{
        const {_uid, _added, ...clean} = d;
        return addDoc(collection(db,'schedules'),{...clean, 청구:'청구완료', createdAt:d.날짜||new Date().toISOString()});
      });
      await Promise.all([setDoc(doc(db,'meta','deleted_ids'),{ids:[...newDel]}),...addOps]);
      count+=baseTargets.length;
    }
    showToast(`✅ ${count}건 청구완료 처리됐습니다!`);
  }catch(e){alert('오류: '+e.message);}
  btn.textContent='💰 완료건 청구완료 일괄처리';btn.disabled=false;
}
function openVesselEditByIndex(idx){
  const v = window._currentVesselList && window._currentVesselList[idx];
  if(!v) return;
  openVesselEdit(v._fbId||'', v.선명);
}
async function deleteVessel(idx){
  const v=window._currentVesselList&&window._currentVesselList[idx];
  if(!v)return;
  if(!confirm(`"${v.선명}" 선박을 삭제할까요?\n관련 작업 기록은 유지됩니다.`))return;
  try{
    if(v._fbId){
      // Firebase vessels에서 삭제
      await deleteDoc(doc(db,'vessels',v._fbId));
    } else {
      // BASE_VESSELS → deleted_ids에 추가
      const uid='base_'+BASE_DATA.findIndex(d=>d.선명===v.선명);
      const newDel=new Set(deletedIds);
      newDel.add(uid);
      await setDoc(doc(db,'meta','deleted_ids'),{ids:[...newDel]});
    }
    showToast(`🗑 "${v.선명}" 삭제됐습니다`);
    renderVesselCompanyChips();
    renderVesselList(document.getElementById('vesselSearchInput').value);
  }catch(e){alert('삭제 실패: '+e.message);}
}
async function deleteVesselFromForm(){
  const fbId=document.getElementById('vf_fbId').value;
  const name=document.getElementById('vf_oldName').value||document.getElementById('vf_선명').value;
  if(!name)return;
  if(!confirm(`"${name}" 선박을 삭제할까요?\n관련 작업 기록은 유지됩니다.`))return;
  try{
    if(fbId){
      await deleteDoc(doc(db,'vessels',fbId));
    } else {
      const uid='base_'+BASE_DATA.findIndex(d=>d.선명===name);
      const newDel=new Set(deletedIds);
      newDel.add(uid);
      await setDoc(doc(db,'meta','deleted_ids'),{ids:[...newDel]});
    }
    closeVesselForm();
    renderVesselCompanyChips();
    renderVesselList(document.getElementById('vesselSearchInput').value);
    showToast(`🗑 "${name}" 삭제됐습니다`);
  }catch(e){alert('삭제 실패: '+e.message);}
}

/* ===== 달력 뷰 ===== */
let calYear, calMonth, calSelectedDate=null, isCalendarMode=false;
function toggleCalendarView(){
  isCalendarMode=!isCalendarMode;
  const listEl=document.getElementById('list');
  const pagerEl=document.getElementById('pager');
  const calEl=document.getElementById('calendarView');
  const btn=document.getElementById('viewToggleBtn');
  if(isCalendarMode){
    listEl.style.display='none';
    if(pagerEl)pagerEl.style.display='none';
    calEl.style.display='block';
    btn.textContent='📋 목록';
    const t=new Date();
    if(calYear===undefined){calYear=t.getFullYear();calMonth=t.getMonth();}
    renderCalendar();
  }else{
    listEl.style.display='';
    calEl.style.display='none';
    btn.textContent='📅 달력';
    applyFilters();
  }
}
function calPrevMonth(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}calSelectedDate=null;renderCalendar();}
function calNextMonth(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}calSelectedDate=null;renderCalendar();}
function renderCalendar(){
  const el=document.getElementById('calendarView');
  const first=new Date(calYear,calMonth,1);
  const startDow=first.getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=localDateStr();
  // 날짜별로 입항/하가/출항 이벤트 집계
  const byDate={};
  function push(date,type,d){
    if(!date)return;
    if(!byDate[date])byDate[date]={입항:[],하가:[],출항:[]};
    byDate[date][type].push(d);
  }
  ALL_DATA.forEach(d=>{
    push(d.날짜,'입항',d);
    push(d.하가일정,'하가',d);
    push(d.출항일정,'출항',d);
  });
  const dows=['일','월','화','수','목','금','토'];
  let html='<div class="cal-wrap">';
  html+='<div class="cal-head"><button onclick="calPrevMonth()">‹</button>';
  html+=`<span class="cal-title">${calYear}년 ${calMonth+1}월</span>`;
  html+='<button onclick="calNextMonth()">›</button></div>';
  html+='<div class="cal-dow-row">';
  dows.forEach((d,i)=>{html+=`<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`;});
  html+='</div>';
  html+='<div class="cal-grid">';
  for(let i=0;i<startDow;i++)html+='<div class="cal-cell empty"></div>';
  for(let day=1;day<=daysInMonth;day++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const ev=byDate[ds];
    const isToday=ds===todayStr;
    const isSel=ds===calSelectedDate;
    let dots='';
    if(ev){
      dots='<div class="cal-dots">';
      if(ev.입항.length)dots+='<span class="cal-dot" style="background:#0a84ff"></span>';
      if(ev.하가.length)dots+='<span class="cal-dot" style="background:#ff9f0a"></span>';
      if(ev.출항.length)dots+='<span class="cal-dot" style="background:#30d158"></span>';
      dots+='</div>';
    }
    html+=`<div class="cal-cell ${isToday?'today':''} ${isSel?'selected':''}" onclick="calSelectDate('${ds}')"><span style="${dots?'transform:translateY(-5px)':''}">${day}</span>${dots}</div>`;
  }
  html+='</div>';
  html+='<div class="cal-legend">';
  html+='<span><span class="cal-dot" style="background:#0a84ff"></span>입항</span>';
  html+='<span><span class="cal-dot" style="background:#ff9f0a"></span>하가</span>';
  html+='<span><span class="cal-dot" style="background:#30d158"></span>출항</span>';
  html+='</div></div>';
  if(calSelectedDate){
    const ev=byDate[calSelectedDate]||{입항:[],하가:[],출항:[]};
    const total=ev.입항.length+ev.하가.length+ev.출항.length;
    html+='<div class="cal-day-list">';
    html+=`<div class="cal-day-title">📅 ${calSelectedDate} (${total}건)</div>`;
    if(!total){
      html+='<div style="font-size:13px;color:#8e8e93;padding:8px 2px">일정 없음</div>';
    }else{
      const order=[['입항',ev.입항,'#0a84ff','#e3f2fd'],['하가',ev.하가,'#b45309','#fff3e0'],['출항',ev.출항,'#0369a1','#e0f2fe']];
      order.forEach(([label,arr,color,bg])=>{
        arr.forEach(d=>{
          html+=`<div class="cal-day-card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
              <span style="font-size:14px;font-weight:700">${d.선명||'-'}</span>
              <span style="font-size:11px;font-weight:700;color:${color};background:${bg};padding:2px 8px;border-radius:6px;flex-shrink:0">${label}</span>
            </div>
            <div style="font-size:12px;color:#8e8e93;margin-top:3px">${d.선사||'-'} · ${d.장소||'-'}</div>
          </div>`;
        });
      });
    }
    html+='</div>';
  }else{
    html+='<div style="font-size:13px;color:#8e8e93;text-align:center;margin-top:14px">날짜를 탭하면 그날 일정이 표시됩니다</div>';
  }
  el.innerHTML=html;
}
function calSelectDate(ds){calSelectedDate=(calSelectedDate===ds?null:ds);renderCalendar();}
window.toggleCalendarView=toggleCalendarView;
window.calPrevMonth=calPrevMonth;
window.calNextMonth=calNextMonth;
window.calSelectDate=calSelectDate;

init();
