<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>작업 스케줄</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f5f5f7;color:#1c1c1e;font-size:15px;overscroll-behavior:none}
.hdr{position:sticky;top:0;z-index:200;background:#1c1c1e;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.hdr h1{font-size:17px;font-weight:700;flex:1}
.badge{background:#0a84ff;color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.hdr-add{background:#30d158;color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#30d158;flex-shrink:0}
.sync-dot.loading{background:#ff9f0a;animation:pulse 1s infinite}
.sync-dot.error{background:#ff375f}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.search-bar{background:#fff;border-bottom:1px solid #e5e5ea;padding:10px 14px;position:sticky;top:50px;z-index:190}
.search-inner{display:flex;align-items:center;background:#f2f2f7;border-radius:12px;padding:0 12px;gap:8px}
.search-inner input{flex:1;border:none;background:transparent;font-size:15px;padding:10px 0;outline:none;color:#1c1c1e}
.search-inner input::placeholder{color:#8e8e93}
.clear-btn{background:none;border:none;color:#8e8e93;font-size:18px;padding:4px;cursor:pointer;display:none}
.filter-row{background:#fff;border-bottom:1px solid #e5e5ea;padding:8px 14px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:102px;z-index:180}
.filter-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:#f2f2f7;border:none;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;color:#3c3c43;cursor:pointer;white-space:nowrap}
.chip.active{background:#0a84ff;color:#fff}
.info-bar{background:#f5f5f7;padding:8px 16px;display:flex;align-items:center;justify-content:space-between}
.info-bar span{font-size:13px;color:#8e8e93}
.sort-select{background:none;border:none;font-size:13px;color:#0a84ff;font-weight:600;cursor:pointer;outline:none}
.list{padding:0 0 80px}
.card{background:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:0.5px solid #e5e5ea}
.card.is-new{border-left:4px solid #30d158}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ship-name{font-size:16px;font-weight:700;color:#0a84ff;flex:1}
.status-badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap}
.s-완료{background:#e8f5e9;color:#2e7d32}
.s-예정{background:#e3f2fd;color:#1565c0}
.s-연기{background:#fff3e0;color:#e65100}
.s-캔슬{background:#fce4ec;color:#c62828}
.del-btn{background:none;border:none;color:#c7c7cc;font-size:20px;padding:2px 4px;cursor:pointer;flex-shrink:0}
.del-btn:active{color:#ff375f}
.edit-btn{background:none;border:none;color:#c7c7cc;font-size:18px;padding:2px 4px;cursor:pointer;flex-shrink:0}
.edit-btn:active{color:#0a84ff}
.card-meta{display:flex;align-items:center;gap:6px;font-size:13px;color:#3c3c43;flex-wrap:wrap}
.card-meta .sep{color:#c7c7cc}
.card-date{font-size:13px;color:#8e8e93;font-weight:500}
.section{margin-top:5px}
.section-title{font-size:11px;font-weight:700;color:#8e8e93;letter-spacing:.5px;margin-bottom:4px}
.engine-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.eng-model{font-size:13px;color:#1c1c1e;font-weight:500}
.eng-gov{background:#f2f2f7;color:#3c3c43;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.eng-work{background:#e8f4fd;color:#0055a5;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500}
.t-place{background:#f3e8fd;color:#6b21a8}
.t-overseas{background:#fdf3e8;color:#7c3a00}
.t-haga{background:#fff3e0;color:#b45309}
.note-box{margin-top:6px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 12px;display:flex;align-items:flex-start;gap:6px}
.note-box .note-icon{font-size:14px;flex-shrink:0}
.note-box .note-text{font-size:13px;color:#92400e;line-height:1.5;font-weight:500}
.pager{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid #e5e5ea;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:8px;z-index:300}
.pg-btn{background:#f2f2f7;border:none;border-radius:10px;padding:8px 18px;font-size:14px;font-weight:600;color:#0a84ff;cursor:pointer}
.pg-btn:disabled{color:#c7c7cc}
.pg-info{font-size:13px;color:#8e8e93;min-width:70px;text-align:center}
.empty{text-align:center;padding:80px 20px;color:#8e8e93}
.empty .icon{font-size:48px;margin-bottom:12px}
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500}
.panel-overlay.open{display:block}
.panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:0 0 40px;max-height:85vh;display:flex;flex-direction:column;z-index:501;transform:translateY(100%);transition:transform .3s}
.panel.open{transform:translateY(0)}
.panel-handle{width:36px;height:4px;background:#d1d1d6;border-radius:2px;margin:12px auto 0}
.panel-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid #e5e5ea}
.panel-header h2{font-size:17px;font-weight:700}
.panel-close{background:none;border:none;font-size:24px;color:#8e8e93;cursor:pointer}
.panel-body{flex:1;overflow-y:auto;padding:8px 16px}
.check-grid{display:flex;flex-wrap:wrap;gap:7px}
.check-chip{background:#f2f2f7;border:1.5px solid transparent;border-radius:20px;padding:7px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:5px;color:#1c1c1e}
.check-chip.active{background:#e8f2ff;border-color:#0a84ff;color:#0a84ff}
.cnt{font-size:11px;color:#8e8e93}
.panel-footer{padding:12px 16px 0;display:flex;gap:10px;border-top:0.5px solid #e5e5ea}
.btn-reset{flex:1;background:#f2f2f7;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:600;color:#3c3c43;cursor:pointer}
.btn-apply{flex:2;background:#0a84ff;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer}
.filter-fab{position:fixed;bottom:62px;right:16px;background:#1c1c1e;color:#fff;border:none;border-radius:50px;padding:12px 20px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;z-index:400}
.filter-fab .dot{background:#ff375f;width:8px;height:8px;border-radius:50%;display:none}
.filter-fab .dot.on{display:block}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600}
.modal-overlay.open{display:block}
.modal{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;z-index:601;transform:translateY(100%);transition:transform .3s}
.modal.open{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:#d1d1d6;border-radius:2px;margin:12px auto 0}
.modal-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid #e5e5ea}
.modal-header h2{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;font-size:24px;color:#8e8e93;cursor:pointer}
.modal-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:13px;font-weight:600;color:#3c3c43}
.form-group label .req{color:#ff375f;margin-left:2px}
.form-input{background:#f2f2f7;border:none;border-radius:12px;padding:12px 14px;font-size:15px;color:#1c1c1e;outline:none;width:100%;font-family:inherit}
.form-input:focus{background:#e8f2ff}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-select{background:#f2f2f7;border:none;border-radius:12px;padding:12px 14px;font-size:15px;color:#1c1c1e;outline:none;width:100%;font-family:inherit;-webkit-appearance:none}
.form-divider{font-size:12px;font-weight:700;color:#8e8e93;letter-spacing:.5px;border-bottom:1px solid #f2f2f7;padding-bottom:8px}
.modal-footer{padding:12px 16px 30px;border-top:0.5px solid #e5e5ea}
.btn-submit{width:100%;background:#30d158;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;cursor:pointer}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="hdr">
  <span style="font-size:20px">⚙️</span>
  <h1>작업 스케줄</h1>
  <div class="sync-dot loading" id="syncDot" title="동기화 상태"></div>
  <div class="badge" id="totalBadge">-</div>
  <button class="hdr-add" onclick="openAddModal()">+ 추가</button>
</div>

<div class="search-bar">
  <div class="search-inner">
    <span style="color:#8e8e93;font-size:16px">🔍</span>
    <input type="search" id="searchInput" placeholder="선명 또는 선사 검색">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
</div>

<div class="filter-row">
  <button class="chip" onclick="openPanel('상태')">상태</button>
  <button class="chip" onclick="openPanel('구분')">국내/해외</button>
  <button class="chip" onclick="openPanel('메인GOV')">메인GOV</button>
  <button class="chip" onclick="openPanel('발전기GOV')">발전기GOV</button>
</div>

<div class="info-bar">
  <span><strong id="resultCount">-</strong>건</span>
  <select class="sort-select" id="sortSel" onchange="applyFilters()">
    <option value="date_desc">최신순</option>
    <option value="date_asc">오래된순</option>
    <option value="name">선명순</option>
  </select>
</div>

<div class="list" id="list">
  <div class="empty"><div class="icon">⏳</div><p>데이터 불러오는 중...</p></div>
</div>

<div class="pager" id="pager" style="display:none">
  <button class="pg-btn" id="prevBtn" onclick="goPage(-1)" disabled>◀ 이전</button>
  <span class="pg-info" id="pgInfo"></span>
  <button class="pg-btn" id="nextBtn" onclick="goPage(1)">다음 ▶</button>
</div>

<button class="filter-fab" onclick="openPanel('상태')">
  <span>필터</span>
  <span class="dot" id="filterDot"></span>
</button>

<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-handle"></div>
  <div class="panel-header">
    <h2 id="panelTitle">필터</h2>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-footer">
    <button class="btn-reset" onclick="resetCurrent()">초기화</button>
    <button class="btn-apply" onclick="applyAndClose()">적용</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeAddModal()"></div>
<div class="modal" id="addModal">
  <div class="modal-handle"></div>
  <div class="modal-header">
    <h2>작업 일정 추가</h2>
    <button class="modal-close" onclick="closeAddModal()">✕</button>
  </div>
  <div class="modal-body">
    <div class="form-row">
      <div class="form-group">
        <label>날짜<span class="req">*</span></label>
        <input type="date" class="form-input" id="f_날짜">
      </div>
      <div class="form-group">
        <label>상태</label>
        <select class="form-select" id="f_상태">
          <option value="예정">예정</option>
          <option value="완료">완료</option>
          <option value="연기">연기</option>
          <option value="캔슬">캔슬</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>선명<span class="req">*</span></label>
        <input type="text" class="form-input" id="f_선명" placeholder="선명 입력">
      </div>
      <div class="form-group">
        <label>선사</label>
        <input type="text" class="form-input" id="f_선사" placeholder="선사 입력">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>조선소/장소</label>
        <input type="text" class="form-input" id="f_장소" placeholder="장소 입력">
      </div>
      <div class="form-group">
        <label>국내/해외</label>
        <select class="form-select" id="f_구분">
          <option value="국내">국내</option>
          <option value="해외">해외</option>
        </select>
      </div>
    </div>
    <div class="form-divider">🔧 메인엔진</div>
    <div class="form-group">
      <label>메인엔진 모델</label>
      <input type="text" class="form-input" id="f_메인엔진" placeholder="예: HANSHIN LH41L">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>메인 GOV</label>
        <input type="text" class="form-input" id="f_메인GOV" placeholder="예: UG-10L">
      </div>
      <div class="form-group">
        <label>메인 작업</label>
        <input type="text" class="form-input" id="f_메인작업" placeholder="예: UPG">
      </div>
    </div>
    <div class="form-divider">⚡ 발전기</div>
    <div class="form-group">
      <label>발전기 모델</label>
      <input type="text" class="form-input" id="f_발전기" placeholder="예: YANMAR 6NY16L-DN">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>발전기 GOV</label>
        <input type="text" class="form-input" id="f_발전기GOV" placeholder="예: NZ-61">
      </div>
      <div class="form-group">
        <label>발전기 작업</label>
        <input type="text" class="form-input" id="f_발전기작업" placeholder="예: PG">
      </div>
    </div>
    <div class="form-divider">📋 기타</div>
    <div class="form-row">
      <div class="form-group">
        <label>하가일정</label>
        <input type="date" class="form-input" id="f_하가일정">
      </div>
      <div class="form-group" style="opacity:0"></div>
    </div>
    <div class="form-group">
      <label>비고</label>
      <input type="text" class="form-input" id="f_비고" placeholder="특이사항 입력">
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-submit" onclick="submitAdd()">✅ 일정 추가</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 수정 모달 -->
<div class="modal-overlay" id="editOverlay" onclick="closeEditModal()"></div>
<div class="modal" id="editModal">
  <div class="modal-handle"></div>
  <div class="modal-header">
    <h2>✏️ 일정 수정</h2>
    <button class="modal-close" onclick="closeEditModal()">✕</button>
  </div>
  <div class="modal-body">
    <input type="hidden" id="e_uid">
    <input type="hidden" id="e_isFb">
    <div class="form-row">
      <div class="form-group">
        <label>날짜<span class="req">*</span></label>
        <input type="date" class="form-input" id="e_날짜">
      </div>
      <div class="form-group">
        <label>상태</label>
        <select class="form-select" id="e_상태">
          <option value="예정">예정</option>
          <option value="완료">완료</option>
          <option value="연기">연기</option>
          <option value="캔슬">캔슬</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>선명<span class="req">*</span></label>
        <input type="text" class="form-input" id="e_선명" placeholder="선명 입력">
      </div>
      <div class="form-group">
        <label>선사</label>
        <input type="text" class="form-input" id="e_선사" placeholder="선사 입력">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>조선소/장소</label>
        <input type="text" class="form-input" id="e_장소" placeholder="장소 입력">
      </div>
      <div class="form-group">
        <label>국내/해외</label>
        <select class="form-select" id="e_구분">
          <option value="국내">국내</option>
          <option value="해외">해외</option>
        </select>
      </div>
    </div>
    <div class="form-divider">🔧 메인엔진</div>
    <div class="form-group">
      <label>메인엔진 모델</label>
      <input type="text" class="form-input" id="e_메인엔진" placeholder="예: HANSHIN LH41L">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>메인 GOV</label>
        <input type="text" class="form-input" id="e_메인GOV" placeholder="예: UG-10L">
      </div>
      <div class="form-group">
        <label>메인 작업</label>
        <input type="text" class="form-input" id="e_메인작업" placeholder="예: UPG">
      </div>
    </div>
    <div class="form-divider">⚡ 발전기</div>
    <div class="form-group">
      <label>발전기 모델</label>
      <input type="text" class="form-input" id="e_발전기" placeholder="예: YANMAR 6NY16L-DN">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>발전기 GOV</label>
        <input type="text" class="form-input" id="e_발전기GOV" placeholder="예: NZ-61">
      </div>
      <div class="form-group">
        <label>발전기 작업</label>
        <input type="text" class="form-input" id="e_발전기작업" placeholder="예: PG">
      </div>
    </div>
    <div class="form-divider">📋 기타</div>
    <div class="form-row">
      <div class="form-group">
        <label>하가일정</label>
        <input type="date" class="form-input" id="e_하가일정">
      </div>
      <div class="form-group" style="opacity:0"></div>
    </div>
    <div class="form-group">
      <label>비고</label>
      <input type="text" class="form-input" id="e_비고" placeholder="특이사항 입력">
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-submit" id="editSubmitBtn" onclick="submitEdit()">💾 수정 저장</button>
  </div>
</div>

<script type="module">

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function setSyncDot(state) {
  const d = document.getElementById('syncDot');
  d.className = 'sync-dot' + (state==='ok'?'':state==='loading'?' loading':' error');
}

// Firestore 실시간 리스너
let fbData = [];
const q = query(collection(db, 'schedules'), orderBy('createdAt', 'desc'));
onSnapshot(q, (snap) => {
  fbData = snap.docs.map(d => ({...d.data(), _fbId: d.id, _added: true}));
  setSyncDot('ok');
  buildAll();
  buildOpts();
  document.getElementById('totalBadge').textContent = ALL_DATA.length.toLocaleString();
  applyFilters();
}, (err) => {
  setSyncDot('error');
  console.error(err);
});

// BASE_DATA에 uid 부여
const BASE_WITH_ID = BASE_DATA.map((d,i)=>({...d, _uid:'base_'+i}));

// 로컬 삭제 목록 (BASE_DATA 삭제용)
function loadDeleted(){ try{return new Set(JSON.parse(localStorage.getItem('deleted_ids')||'[]'));}catch(e){return new Set();} }
function saveDeleted(s){ try{localStorage.setItem('deleted_ids',JSON.stringify([...s]));}catch(e){} }

function buildAll() {
  const deleted = loadDeleted();
  const base = BASE_WITH_ID.filter(d=>!deleted.has(d._uid));
  ALL_DATA = [...fbData, ...base];
}

function buildOpts() {
  ['상태','구분','메인GOV','발전기GOV'].forEach(k=>{
    const cnt={};
    ALL_DATA.forEach(d=>{const v=d[k];if(v)cnt[v]=(cnt[v]||0)+1;});
    OPTS[k]=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  });
}

function init() {
  setSyncDot('loading');
  document.getElementById('f_날짜').value = new Date().toISOString().split('T')[0];
  const inp = document.getElementById('searchInput');
  inp.addEventListener('input',()=>{
    document.getElementById('clearBtn').style.display=inp.value?'block':'none';
    page=1; applyFilters();
  });
}

function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('clearBtn').style.display='none';
  page=1; applyFilters();
}

function applyFilters(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  const sort=document.getElementById('sortSel').value;
  filtered=ALL_DATA.filter(d=>{
    if(q&&!(d.선명||'').toLowerCase().includes(q)&&!(d.선사||'').toLowerCase().includes(q))return false;
    if(sel.상태.size&&!sel.상태.has(d.상태))return false;
    if(sel.구분.size&&!sel.구분.has(d.구분))return false;
    if(sel.메인GOV.size&&!sel.메인GOV.has(d.메인GOV))return false;
    if(sel.발전기GOV.size&&!sel.발전기GOV.has(d.발전기GOV))return false;
    return true;
  });
  if(sort==='date_asc') filtered.sort((a,b)=>(a.날짜||'').localeCompare(b.날짜||''));
  else if(sort==='date_desc') filtered.sort((a,b)=>(b.날짜||'').localeCompare(a.날짜||''));
  else filtered.sort((a,b)=>(a.선명||'').localeCompare(b.선명||'','ko'));
  updateChips(); page=1; renderList();
}

function updateChips(){
  const hasFilter=sel.상태.size||sel.구분.size||sel.메인GOV.size||sel.발전기GOV.size;
  document.getElementById('filterDot').className='dot'+(hasFilter?' on':'');
  const labels={상태:'상태',구분:'국내/해외',메인GOV:'메인GOV',발전기GOV:'발전기GOV'};
  ['상태','구분','메인GOV','발전기GOV'].forEach(k=>{
    const btn=document.querySelector(`.chip[onclick="openPanel('${k}')"]`);
    if(btn){btn.className='chip'+(sel[k].size?' active':'');btn.textContent=sel[k].size?labels[k]+' '+sel[k].size:labels[k];}
  });
}

function renderList(){
  const total=filtered.length;
  document.getElementById('resultCount').textContent=total.toLocaleString();
  const listEl=document.getElementById('list');
  if(!total){
    listEl.innerHTML='<div class="empty"><div class="icon">⚙️</div><p>조건에 맞는 작업이 없습니다</p></div>';
    document.getElementById('pager').style.display='none'; return;
  }
  const start=(page-1)*PAGE, end=Math.min(start+PAGE,total);
  listEl.innerHTML=filtered.slice(start,end).map(d=>{
    const sClass='s-'+(d.상태||'');
    const newClass=d._added?' is-new':'';
    const uid=d._fbId||d._uid||'';
    const isFb=!!d._fbId;
    const overseasTag=d.구분==='해외'?`<span class="tag t-overseas">🌐 해외</span>`:'';
    const hagaTag=d.하가일정?`<span class="tag t-haga">📋 하가 ${d.하가일정}</span>`:'';
    let mainSec='';
    if(d.메인엔진||d.메인GOV||d.메인작업){
      mainSec=`<div class="section"><div class="section-title">메인엔진</div><div class="engine-row">
        ${d.메인엔진?`<span class="eng-model">${d.메인엔진}</span>`:''}
        ${d.메인GOV?`<span class="eng-gov">${d.메인GOV}</span>`:''}
        ${d.메인작업?`<span class="eng-work">${d.메인작업}</span>`:''}
      </div></div>`;
    }
    let genSec='';
    if(d.발전기||d.발전기GOV||d.발전기작업){
      genSec=`<div class="section"><div class="section-title">발전기</div><div class="engine-row">
        ${d.발전기?`<span class="eng-model">${d.발전기}</span>`:''}
        ${d.발전기GOV?`<span class="eng-gov">${d.발전기GOV}</span>`:''}
        ${d.발전기작업?`<span class="eng-work">${d.발전기작업}</span>`:''}
      </div></div>`;
    }
    const noteBox=d.비고?`<div class="note-box"><span class="note-icon">📝</span><span class="note-text">${d.비고}</span></div>`:'';
    return `<div class="card${newClass}">
      <div class="card-top">
        <span class="ship-name">${d.선명||'-'}</span>
        <span class="status-badge ${sClass}">${d.상태||'-'}</span>
        <button class="edit-btn" onclick="openEditModal('${uid}',${isFb},${JSON.stringify(JSON.stringify(d))})">✏️</button>
        <button class="del-btn" onclick="deleteItem('${uid}',${isFb},'${(d.선명||'').replace(/'/g,"\\'")}')">🗑</button>
      </div>
      <div class="card-meta">
        <span class="card-date">📅 ${d.날짜||'-'}</span>
        <span class="sep">·</span>
        <span>${d.선사||'-'}</span>
      </div>
      <div class="tags">
        <span class="tag t-place">📍 ${d.장소||'-'}</span>
        ${overseasTag}${hagaTag}
      </div>
      ${mainSec}${genSec}${noteBox}
    </div>`;
  }).join('');
  const totalPages=Math.ceil(total/PAGE);
  document.getElementById('pager').style.display='flex';
  document.getElementById('pgInfo').textContent=page+' / '+totalPages;
  document.getElementById('prevBtn').disabled=page===1;
  document.getElementById('nextBtn').disabled=page===totalPages;
  window.scrollTo(0,0);
}

function goPage(dir){page+=dir;renderList();}

function openPanel(type){
  currentPanel=type;
  const labels={상태:'상태 선택',구분:'국내/해외 선택',메인GOV:'메인 GOV 선택',발전기GOV:'발전기 GOV 선택'};
  document.getElementById('panelTitle').textContent=labels[type]||type;
  document.getElementById('panelBody').innerHTML=`<div style="padding:8px 0"><div class="check-grid">${(OPTS[type]||[]).map(([v,c])=>`
    <button class="check-chip${sel[type].has(v)?' active':''}" onclick="toggleSel('${type}','${v}',this)">
      ${v} <span class="cnt">${c}</span>
    </button>`).join('')}</div></div>`;
  document.getElementById('overlay').classList.add('open');
  requestAnimationFrame(()=>document.getElementById('panel').classList.add('open'));
}
function closePanel(){document.getElementById('overlay').classList.remove('open');document.getElementById('panel').classList.remove('open');}
function toggleSel(type,val,el){sel[type].has(val)?(sel[type].delete(val),el.classList.remove('active')):(sel[type].add(val),el.classList.add('active'));}
function resetCurrent(){if(currentPanel&&sel[currentPanel]){sel[currentPanel].clear();document.querySelectorAll('.check-chip.active').forEach(el=>el.classList.remove('active'));}}
function applyAndClose(){closePanel();applyFilters();}

// 수정 모달
let editData = null;
function openEditModal(uid, isFb, dataStr) {
  try { editData = typeof dataStr === 'string' ? JSON.parse(dataStr) : dataStr; } catch(e){ return; }
  document.getElementById('e_uid').value = uid;
  document.getElementById('e_isFb').value = isFb;
  const flds = ['날짜','선명','선사','장소','구분','상태','메인엔진','메인GOV','메인작업','발전기','발전기GOV','발전기작업','하가일정','비고'];
  flds.forEach(k => {
    const el = document.getElementById('e_'+k);
    if(el) el.value = editData[k] || '';
  });
  document.getElementById('editOverlay').classList.add('open');
  requestAnimationFrame(()=>document.getElementById('editModal').classList.add('open'));
}
function closeEditModal(){
  document.getElementById('editOverlay').classList.remove('open');
  document.getElementById('editModal').classList.remove('open');
}
function ge(id){return document.getElementById(id).value.trim();}

async function submitEdit(){
  const uid = document.getElementById('e_uid').value;
  const isFb = document.getElementById('e_isFb').value === 'true';
  const 날짜 = ge('e_날짜'), 선명 = ge('e_선명');
  if(!날짜||!선명){alert('날짜와 선명은 필수입니다.');return;}
  const updated = {
    날짜, 선명, 선사:ge('e_선사'), 장소:ge('e_장소'),
    구분:ge('e_구분')||'국내', 상태:ge('e_상태')||'예정',
    메인엔진:ge('e_메인엔진'), 메인GOV:ge('e_메인GOV'), 메인작업:ge('e_메인작업'),
    발전기:ge('e_발전기'), 발전기GOV:ge('e_발전기GOV'), 발전기작업:ge('e_발전기작업'),
    하가일정:ge('e_하가일정'), 비고:ge('e_비고'),
  };
  const btn = document.getElementById('editSubmitBtn');
  btn.textContent='저장 중...'; btn.disabled=true;
  try {
    if(isFb) {
      const {updateDoc, doc: fsDoc} = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
      await updateDoc(fsDoc(db,'schedules',uid), updated);
    } else {
      // 기존 엑셀 데이터 수정 → Firebase에 새로 저장 + 기존 삭제처리
      const deleted = loadDeleted();
      deleted.add(uid);
      saveDeleted(deleted);
      await addDoc(collection(db,'schedules'), {...updated, createdAt: new Date().toISOString()});
    }
    closeEditModal();
    showToast(`✅ "${선명}" 수정됐습니다!`);
  } catch(e){ alert('수정 실패: '+e.message); }
  btn.textContent='💾 수정 저장'; btn.disabled=false;
}

window.openEditModal=openEditModal; window.closeEditModal=closeEditModal; window.submitEdit=submitEdit;

function openAddModal(){
  document.getElementById('modalOverlay').classList.add('open');
  requestAnimationFrame(()=>document.getElementById('addModal').classList.add('open'));
}
function closeAddModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('addModal').classList.remove('open');
}
function g(id){return document.getElementById(id).value.trim();}

async function submitAdd(){
  const 날짜=g('f_날짜'), 선명=g('f_선명');
  if(!날짜||!선명){alert('날짜와 선명은 필수입니다.');return;}
  const btn=document.querySelector('.btn-submit');
  btn.textContent='저장 중...'; btn.disabled=true;
  try {
    await addDoc(collection(db,'schedules'),{
      날짜, 선명, 선사:g('f_선사'), 장소:g('f_장소'),
      구분:g('f_구분')||'국내', 상태:g('f_상태')||'예정',
      메인엔진:g('f_메인엔진'), 메인GOV:g('f_메인GOV'), 메인작업:g('f_메인작업'),
      발전기:g('f_발전기'), 발전기GOV:g('f_발전기GOV'), 발전기작업:g('f_발전기작업'),
      하가일정:g('f_하가일정'), 비고:g('f_비고'),
      createdAt: new Date().toISOString()
    });
    ['f_선명','f_선사','f_장소','f_메인엔진','f_메인GOV','f_메인작업','f_발전기','f_발전기GOV','f_발전기작업','f_하가일정','f_비고'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f_상태').value='예정';
    document.getElementById('f_구분').value='국내';
    document.getElementById('f_날짜').value=new Date().toISOString().split('T')[0];
    closeAddModal();
    showToast(`✅ "${선명}" 추가됐습니다!`);
  } catch(e) {
    alert('저장 실패: '+e.message);
  }
  btn.textContent='✅ 일정 추가'; btn.disabled=false;
}

async function deleteItem(uid, isFb, shipName){
  if(!confirm(`"${shipName}" 일정을 삭제할까요?`)) return;
  if(isFb){
    try {
      await deleteDoc(doc(db,'schedules',uid));
      showToast('🗑 삭제됐습니다');
    } catch(e){ alert('삭제 실패: '+e.message); }
  } else {
    const deleted=loadDeleted();
    deleted.add(uid);
    saveDeleted(deleted);
    buildAll(); buildOpts();
    document.getElementById('totalBadge').textContent=ALL_DATA.length.toLocaleString();
    applyFilters();
    showToast('🗑 삭제됐습니다');
  }
}

// 전역 노출
window.openPanel=openPanel; window.closePanel=closePanel;
window.toggleSel=toggleSel; window.resetCurrent=resetCurrent; window.applyAndClose=applyAndClose;
window.goPage=goPage; window.clearSearch=clearSearch;
window.openAddModal=openAddModal; window.closeAddModal=closeAddModal;
window.submitAdd=submitAdd; window.deleteItem=deleteItem;
window.applyFilters=applyFilters;

init();
</script>
